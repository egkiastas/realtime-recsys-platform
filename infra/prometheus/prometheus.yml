global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [alerts.yml]

scrape_configs:
  - job_name: api
    metrics_path: /metrics/
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: stream
    static_configs: [{ targets: ["stream:8000"] }]
  - job_name: replayer
    static_configs: [{ targets: ["replayer:8000"] }]
  - job_name: pushgateway
    honor_labels: true
    static_configs: [{ targets: ["pushgateway:9091"] }]
